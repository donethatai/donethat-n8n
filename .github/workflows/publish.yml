# Publish to npm on version tag push (e.g. 0.3.0). Provenance is signed via
# GitHub's OIDC token; requires npm Trusted Publisher set on npmjs.com with
# this repo + workflow filename, or NPM_TOKEN in repo secrets as a fallback.
# Triggered by `npm run release` (local), which tags and pushes.

name: Publish

on:
  push:
    tags:
      - '*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      id-token: write   # for npm provenance via OIDC
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # Only publish commits that reached main through a reviewed pull request.
      - name: Check the tagged commit is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_SHA is not on main. Tag a commit on main."; exit 1; }

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Release
        run: |
          [ -n "$NPM_TOKEN" ] && npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          npm run release
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Scan published version
        # Same scanner n8n's Creator Portal runs. Confirms provenance is signed
        # and the tarball passes @n8n/community-nodes lint. Allow a short delay
        # for npm CDN propagation before the lookup.
        run: |
          sleep 20
          npx --yes @n8n/scan-community-package@latest n8n-nodes-donethat
